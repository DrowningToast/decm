version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: runtime
    image: "${BACKEND_IMAGE:-decm-backend}:${BACKEND_IMAGE_TAG:-latest}"
    env_file:
      - .env
    environment:
      ENVIRONMENT: "${CORE_ENVIRONMENT:-production}"
      PORT: "${PORT:-8080}"
    ports:
      - "${BACKEND_HTTP_PORT:-8080}:8080"
    restart: unless-stopped
    networks:
      - decm-prod

  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
      args:
        VITE_API_URL: "${VITE_API_URL:-http://localhost:8080/api/v1}"
        VITE_APP_URL: "${VITE_APP_URL:-http://localhost:3000}"
        VITE_ENVIRONMENT: "${VITE_ENVIRONMENT:-production}"
        VITE_GOOGLE_MAPS_API_KEY: "${VITE_GOOGLE_MAPS_API_KEY:-}"
    image: "${FRONTEND_IMAGE:-decm-frontend}:${FRONTEND_IMAGE_TAG:-latest}"
    depends_on:
      - backend
    ports:
      - "${FRONTEND_HTTP_PORT:-3000}:80"
    restart: unless-stopped
    networks:
      - decm-prod

  proxy:
    image: jc21/nginx-proxy-manager:2
    container_name: nginx-proxy-manager
    environment:
      TZ: "${TZ:-UTC}"
      DISABLE_IPV6: "${NPM_DISABLE_IPV6:-true}"
      INIT_ADMIN_EMAIL: "${NPM_ADMIN_EMAIL:-CHANGEME@example.com}"
      INIT_ADMIN_PASSWORD: "${NPM_ADMIN_PASSWORD:-change-me}"
    ports:
      - "${NPM_HTTP_PORT:-80}:80"
      - "${NPM_HTTPS_PORT:-443}:443"
      - "${NPM_ADMIN_PORT:-81}:81"
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - decm-prod

networks:
  decm-prod:
    driver: bridge

volumes:
  npm_data:
  npm_letsencrypt:
