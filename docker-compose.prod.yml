version: "3.9"

services:
    # PostgreSQL Database
    postgres:
        image: postgres:16-alpine
        container_name: decm-postgres-prod
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_NAME:-decm}
            POSTGRES_USER: ${DB_USER:-postgres}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-decm_password}
            POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
        ports:
            - "${DB_PORT:-5432}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-decm}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        networks:
            - decm-prod

    # Backend API
    backend:
        build:
            context: .
            dockerfile: apps/backend/Dockerfile
            target: runtime
        image: "${BACKEND_IMAGE:-decm-backend}:${BACKEND_IMAGE_TAG:-latest}"
        container_name: decm-backend-prod
        env_file:
            - .env
        environment:
            # Core settings
            ENVIRONMENT: "${CORE_ENVIRONMENT:-production}"
            PORT: "${PORT:-8080}"

            # Database configuration
            DB_HOST: postgres
            DB_PORT: 5432
            DB_USER: ${DB_USER:-postgres}
            DB_PASSWORD: ${DB_PASSWORD:-decm_password}
            DB_NAME: ${DB_NAME:-decm}
            DB_SSL_MODE: ${DB_SSL_MODE:-disable}

            # Security
            PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY}
            JWT_SECRET: ${JWT_SECRET}
            JWT_ISSUER: ${JWT_ISSUER:-decm-service}
            JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}

            # CORS
            CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

            # Blockchain
            BLOCKCHAIN_NETWORK: ${BLOCKCHAIN_NETWORK}
            BLOCKCHAIN_RPC_URL: ${BLOCKCHAIN_RPC_URL}
            BLOCKCHAIN_PRIVATE_KEY: ${BLOCKCHAIN_PRIVATE_KEY}
            BLOCKCHAIN_CHAIN_ID: ${BLOCKCHAIN_CHAIN_ID}
            BLOCKCHAIN_ETHERSCAN_API_KEY: ${BLOCKCHAIN_ETHERSCAN_API_KEY}
            BLOCKCHAIN_DECM_ACCESS_MANAGER_ADDRESS: ${BLOCKCHAIN_DECM_ACCESS_MANAGER_ADDRESS}

            # OAuth
            GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
            GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
            GOOGLE_OAUTH_REDIRECT_URL: ${GOOGLE_OAUTH_REDIRECT_URL}
            GOOGLE_OAUTH_SUCCESS_URL: ${GOOGLE_OAUTH_SUCCESS_URL}

            # S3 Storage
            S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
            S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
            S3_BUCKET_NAME: ${S3_BUCKET_NAME}
            S3_ENDPOINT: ${S3_ENDPOINT}
        ports:
            - "${BACKEND_HTTP_PORT:-8080}:8080"
        depends_on:
            postgres:
                condition: service_healthy
        healthcheck:
            test:
                [
                    "CMD",
                    "wget",
                    "--quiet",
                    "--tries=1",
                    "-O",
                    "/dev/null",
                    "http://localhost:8080/ready",
                ]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
        restart: unless-stopped
        networks:
            - decm-prod

    # Frontend Web App
    frontend:
        build:
            context: .
            dockerfile: apps/web/Dockerfile
            target: runtime
            args:
                VITE_CORE_BACKEND_API: "${VITE_CORE_BACKEND_API:-http://localhost:8080}"
                VITE_APP_URL: "${VITE_APP_URL:-http://localhost:3000}"
                VITE_ENVIRONMENT: "${VITE_ENVIRONMENT:-production}"
                VITE_GOOGLE_MAPS_API_KEY: "${VITE_GOOGLE_MAPS_API_KEY:-}"
                VITE_WALLETCONNECT_PROJECT_ID: "${VITE_WALLETCONNECT_PROJECT_ID:-}"
        image: "${FRONTEND_IMAGE:-decm-frontend}:${FRONTEND_IMAGE_TAG:-latest}"
        container_name: decm-frontend-prod
        depends_on:
            backend:
                condition: service_healthy
        ports:
            - "${FRONTEND_HTTP_PORT:-3000}:80"
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost/"]
            interval: 30s
            timeout: 5s
            retries: 3
        restart: unless-stopped
        networks:
            - decm-prod

    # Nginx Proxy Manager (Optional - for SSL/reverse proxy)
    proxy:
        image: jc21/nginx-proxy-manager:2
        container_name: decm-nginx-proxy-manager
        environment:
            TZ: "${TZ:-UTC}"
            DISABLE_IPV6: "${NPM_DISABLE_IPV6:-true}"
            INIT_ADMIN_EMAIL: "${NPM_ADMIN_EMAIL:-admin@example.com}"
            INIT_ADMIN_PASSWORD: "${NPM_ADMIN_PASSWORD:-changeme}"
        ports:
            - "${NPM_HTTP_PORT:-80}:80"
            - "${NPM_HTTPS_PORT:-443}:443"
            - "${NPM_ADMIN_PORT:-81}:81"
        volumes:
            - npm_data:/data
            - npm_letsencrypt:/etc/letsencrypt
        depends_on:
            - backend
            - frontend
        restart: unless-stopped
        networks:
            - decm-prod
        profiles:
            - proxy # Only start when explicitly requested with --profile proxy

networks:
    decm-prod:
        driver: bridge

volumes:
    postgres_data:
        driver: local
    npm_data:
        driver: local
    npm_letsencrypt:
        driver: local
