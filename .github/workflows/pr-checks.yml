name: PR Quality Checks

on:
    # Also run on pull requests targeting main
    pull_request:
        branches:
            - main

env:
    GO_VERSION: "1.23"
    NODE_VERSION: "20"
    PNPM_VERSION: "9.15.0"

jobs:
    # Job 1: Docker Compose & Database Setup
    docker-compose-checks:
        name: Docker Compose & Database Setup
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "pnpm"

            - name: Copy test environment file
              run: cp .env.test .env

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install golang-migrate
              run: |
                  curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xvz
                  sudo mv migrate /usr/local/bin/
                  migrate -version

            - name: Start Docker Compose
              run: pnpm compose:up

            - name: Wait for PostgreSQL to be ready
              run: |
                  timeout 60 bash -c 'until docker exec decm-postgres pg_isready -U decm_user -d decm_test; do
                    echo "Waiting for PostgreSQL to be ready..."
                    sleep 2
                  done'
              env:
                  DB_NAME: decm_test
                  DB_USER: decm_user

            - name: Verify PostgreSQL is accessible
              run: |
                  docker exec decm-postgres psql -U decm_user -d decm_test -c "SELECT version();"

            - name: Run database migrations
              run: pnpm db:migrate
              env:
                  DB_HOST: localhost
                  DB_PORT: 5432
                  DB_USER: decm_user
                  DB_PASSWORD: decm_test_password
                  DB_NAME: decm_test

            - name: Verify migrations applied successfully
              run: |
                  docker exec decm-postgres psql -U decm_user -d decm_test -c "\dt" | tee migration_output.txt
                  grep -q "authentication_credentials" migration_output.txt
                  grep -q "profiles" migration_output.txt
                  grep -q "events" migration_output.txt
                  echo "✅ All core tables verified"

            - name: Verify pgcrypto extension is enabled
              run: |
                  docker exec decm-postgres psql -U decm_user -d decm_test -c "SELECT * FROM pg_extension WHERE extname = 'pgcrypto';" | grep pgcrypto
                  echo "✅ pgcrypto extension verified"

            - name: Cleanup - Stop Docker Compose
              if: always()
              run: pnpm compose:down

    # Job 2: Database & SQLC Generation
    database-checks:
        name: Database & SQLC Checks
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_DB: decm_test
                    POSTGRES_USER: decm_user
                    POSTGRES_PASSWORD: decm_test_password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "pnpm"

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache-dependency-path: |
                      apps/backend/go.sum
                      packages/database/go.sum

            - name: Copy test environment file
              run: cp .env.test .env

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install sqlc
              run: |
                  curl -sSfL https://github.com/sqlc-dev/sqlc/releases/download/v1.27.0/sqlc_1.27.0_linux_amd64.tar.gz | tar -xz -C /tmp
                  sudo mv /tmp/sqlc /usr/local/bin/
                  sqlc version

            - name: Install golang-migrate
              run: |
                  curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xvz
                  sudo mv migrate /usr/local/bin/
                  migrate -version

            - name: Wait for PostgreSQL
              run: |
                  until pg_isready -h localhost -p 5432 -U decm_user; do
                    echo "Waiting for PostgreSQL..."
                    sleep 2
                  done

            - name: Run database migrations
              run: pnpm db:migrate
              env:
                  DB_HOST: localhost
                  DB_PORT: 5432
                  DB_USER: decm_user
                  DB_PASSWORD: decm_test_password
                  DB_NAME: decm_test

            - name: Generate SQLC code
              run: pnpm db:generate

            - name: Check SQLC generated files match committed files
              run: |
                  if ! git diff --exit-code packages/database/go/generated/; then
                    echo "❌ SQLC generated files do not match committed files!"
                    echo "Run 'pnpm db:generate' locally and commit the changes."
                    git diff packages/database/go/generated/
                    exit 1
                  else
                    echo "✅ SQLC generated files match committed files"
                  fi

    # Job 3: Backend Build & Tests
    backend-checks:
        name: Backend Build & Tests
        runs-on: ubuntu-latest
        needs: [docker-compose-checks, database-checks]

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_DB: decm_test
                    POSTGRES_USER: decm_user
                    POSTGRES_PASSWORD: decm_test_password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "pnpm"

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache-dependency-path: |
                      apps/backend/go.sum
                      packages/database/go.sum

            - name: Copy test environment file
              run: cp .env.test .env

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install golang-migrate
              run: |
                  curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xvz
                  sudo mv migrate /usr/local/bin/
                  migrate -version

            - name: Run database migrations
              run: pnpm db:migrate
              env:
                  DB_HOST: localhost
                  DB_PORT: 5432
                  DB_USER: decm_user
                  DB_PASSWORD: decm_test_password
                  DB_NAME: decm_test

            - name: Install Go dependencies
              working-directory: apps/backend
              run: go mod download

            - name: Setup Go workspace
              working-directory: apps/backend
              run: |
                  echo "Setting up Go workspace..."
                  go work use .
                  go work use ../../packages/database
                  go work sync
                  cat go.work

            - name: Build Core API
              run: pnpm build:core

            - name: Verify binary exists
              run: |
                  if [ ! -f apps/backend/bin/decm-backend ]; then
                    echo "❌ Core API binary not found!"
                    exit 1
                  else
                    echo "✅ Core API binary built successfully"
                  fi

            - name: Run backend unit tests
              run: pnpm test:core
              env:
                  DB_HOST: localhost
                  DB_PORT: 5432
                  DB_USER: decm_user
                  DB_PASSWORD: decm_test_password
                  DB_NAME: decm_test
                  PII_ENCRYPTION_KEY: test-encryption-key-for-ci-pipeline-only-32bytes
                  JWT_SECRET: test-jwt-secret-key-for-ci-pipeline-only
                  JWT_ISSUER: decm-service-test
                  JWT_EXPIRATION: 24h

    # Job 4: OpenAPI & Swagger Documentation
    openapi-checks:
        name: OpenAPI & Swagger Checks
        runs-on: ubuntu-latest
        needs: backend-checks

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "pnpm"

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache-dependency-path: apps/backend/go.sum

            - name: Install swag
              run: go install github.com/swaggo/swag/cmd/swag@latest

            - name: Copy test environment file
              run: cp .env.test .env

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Generate OpenAPI documentation
              run: pnpm docs:core

            - name: Check OpenAPI documentation matches committed files
              run: |
                  if ! git diff --exit-code apps/backend/core-api/docs/; then
                    echo "❌ OpenAPI documentation does not match committed files!"
                    echo "Run 'pnpm docs:core' locally and commit the changes."
                    git diff apps/backend/core-api/docs/
                    exit 1
                  else
                    echo "✅ OpenAPI documentation matches committed files"
                  fi

    # Job 5: Frontend Build & Tests
    frontend-checks:
        name: Frontend Build & Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "pnpm"

            - name: Copy test environment files
              run: |
                  cp .env.test .env
                  cp .env.client.test .env.client

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run TypeScript type checking
              run: pnpm check-types

            - name: Run ESLint
              run: pnpm lint

            - name: Run frontend unit tests
              run: pnpm --filter @decm/web test run
              env:
                  VITE_API_URL: http://localhost:8080/api/v1
                  VITE_ENVIRONMENT: test

            - name: Build frontend
              run: pnpm build

            - name: Verify build artifacts
              run: |
                  if [ ! -d apps/web/dist ]; then
                    echo "❌ Frontend build artifacts not found!"
                    exit 1
                  else
                    echo "✅ Frontend built successfully"
                  fi

    # Job 6: Smart Contracts
    contracts-checks:
        name: Smart Contracts Compilation
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@v1
              with:
                  version: nightly

            - name: Compile smart contracts
              working-directory: apps/contracts
              run: |
                  forge install
                  forge build

            - name: Verify contract artifacts
              run: |
                  if [ ! -d apps/contracts/out ]; then
                    echo "❌ Contract compilation artifacts not found!"
                    exit 1
                  else
                    echo "✅ Contracts compiled successfully"
                  fi

    # Job 7: Final Summary
    pr-checks-summary:
        name: PR Checks Summary
        runs-on: ubuntu-latest
        needs:
            [
                docker-compose-checks,
                database-checks,
                backend-checks,
                openapi-checks,
                frontend-checks,
                contracts-checks,
            ]
        if: always()

        steps:
            - name: Check all jobs status
              run: |
                  echo "### PR Quality Checks Summary ###"
                  echo ""

                  if [ "${{ needs.docker-compose-checks.result }}" = "success" ]; then
                    echo "✅ Docker Compose & Database Setup: PASSED"
                  else
                    echo "❌ Docker Compose & Database Setup: FAILED"
                  fi

                  if [ "${{ needs.database-checks.result }}" = "success" ]; then
                    echo "✅ Database & SQLC Checks: PASSED"
                  else
                    echo "❌ Database & SQLC Checks: FAILED"
                  fi

                  if [ "${{ needs.backend-checks.result }}" = "success" ]; then
                    echo "✅ Backend Build & Tests: PASSED"
                  else
                    echo "❌ Backend Build & Tests: FAILED"
                  fi

                  if [ "${{ needs.openapi-checks.result }}" = "success" ]; then
                    echo "✅ OpenAPI & Swagger Checks: PASSED"
                  else
                    echo "❌ OpenAPI & Swagger Checks: FAILED"
                  fi

                  if [ "${{ needs.frontend-checks.result }}" = "success" ]; then
                    echo "✅ Frontend Build & Tests: PASSED"
                  else
                    echo "❌ Frontend Build & Tests: FAILED"
                  fi

                  if [ "${{ needs.contracts-checks.result }}" = "success" ]; then
                    echo "✅ Smart Contracts Compilation: PASSED"
                  else
                    echo "❌ Smart Contracts Compilation: FAILED"
                  fi

                  echo ""

                  if [ "${{ needs.docker-compose-checks.result }}" = "success" ] && \
                     [ "${{ needs.database-checks.result }}" = "success" ] && \
                     [ "${{ needs.backend-checks.result }}" = "success" ] && \
                     [ "${{ needs.openapi-checks.result }}" = "success" ] && \
                     [ "${{ needs.frontend-checks.result }}" = "success" ] && \
                     [ "${{ needs.contracts-checks.result }}" = "success" ]; then
                    echo "🎉 All checks passed! PR is ready to merge."
                    exit 0
                  else
                    echo "❌ Some checks failed. Please review and fix the issues."
                    exit 1
                  fi
