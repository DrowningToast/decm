name: PR Quality Checks

on:
    # Also run on pull requests targeting main
    pull_request:
        branches:
            - main

env:
    GO_VERSION: "1.23"
    NODE_VERSION: "20"
    PNPM_VERSION: "9.15.0"

jobs:
    # Job 1: Docker Compose Successfully
    docker-compose:
        name: Docker Compose
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "pnpm"

            - name: Copy test environment file
              run: cp .env.test .env

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Start Docker Compose
              run: pnpm compose:up

            - name: Wait for PostgreSQL to be ready
              run: |
                  timeout 60 bash -c 'until docker exec decm-postgres pg_isready -U decm_user -d decm_test; do
                    echo "Waiting for PostgreSQL to be ready..."
                    sleep 2
                  done'
              env:
                  DB_NAME: decm_test
                  DB_USER: decm_user

            - name: Verify PostgreSQL is accessible
              run: |
                  docker exec decm-postgres psql -U decm_user -d decm_test -c "SELECT version();"

            - name: Cleanup - Stop Docker Compose
              if: always()
              run: pnpm compose:down

    # Job 2: Database Can Be Migrated
    database-migrate:
        name: Database Migration
        runs-on: ubuntu-latest
        needs: [docker-compose]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "pnpm"

            - name: Install golang-migrate
              run: |
                  curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xvz
                  sudo mv migrate /usr/local/bin/
                  migrate -version

            - name: Copy test environment file
              run: cp .env.test .env

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Start Docker Compose
              run: pnpm compose:up

            - name: Wait for PostgreSQL to be ready
              run: |
                  timeout 60 bash -c 'until docker exec decm-postgres pg_isready -U decm_user -d decm_test; do
                    echo "Waiting for PostgreSQL to be ready..."
                    sleep 2
                  done'

            - name: Run database migrations
              run: pnpm db:migrate
              env:
                  DB_HOST: localhost
                  DB_PORT: 5432
                  DB_USER: decm_user
                  DB_PASSWORD: decm_test_password
                  DB_NAME: decm_test

            - name: Verify migrations applied successfully
              run: |
                  docker exec decm-postgres psql -U decm_user -d decm_test -c "\dt" | tee migration_output.txt
                  grep -q "authentication_credentials" migration_output.txt
                  grep -q "profiles" migration_output.txt
                  grep -q "events" migration_output.txt
                  echo "✅ All core tables verified"

            - name: Cleanup - Stop Docker Compose
              if: always()
              run: pnpm compose:down

    # Job 3: Database Can Be Generated
    database-generate:
        name: Database Generation (SQLC)
        runs-on: ubuntu-latest
        needs: [database-migrate]

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_DB: decm_test
                    POSTGRES_USER: decm_user
                    POSTGRES_PASSWORD: decm_test_password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "pnpm"

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache-dependency-path: packages/database/go.sum

            - name: Copy test environment file
              run: cp .env.test .env

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install sqlc
              run: |
                  curl -sSfL https://github.com/sqlc-dev/sqlc/releases/download/v1.27.0/sqlc_1.27.0_linux_amd64.tar.gz | tar -xz -C /tmp
                  sudo mv /tmp/sqlc /usr/local/bin/
                  sqlc version

            - name: Install golang-migrate
              run: |
                  curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xvz
                  sudo mv migrate /usr/local/bin/
                  migrate -version

            - name: Wait for PostgreSQL
              run: |
                  until pg_isready -h localhost -p 5432 -U decm_user; do
                    echo "Waiting for PostgreSQL..."
                    sleep 2
                  done

            - name: Run database migrations
              run: pnpm db:migrate
              env:
                  DB_HOST: localhost
                  DB_PORT: 5432
                  DB_USER: decm_user
                  DB_PASSWORD: decm_test_password
                  DB_NAME: decm_test

            - name: Generate SQLC code
              run: pnpm db:generate

            - name: Check SQLC generated files match committed files
              run: |
                  if ! git diff --exit-code packages/database/go/generated/; then
                    echo "❌ SQLC generated files do not match committed files!"
                    echo "Run 'pnpm db:generate' locally and commit the changes."
                    git diff packages/database/go/generated/
                    exit 1
                  else
                    echo "✅ SQLC generated files match committed files"
                  fi

    # Job 4: Backend Build Successfully
    backend-build:
        name: Backend Build
        runs-on: ubuntu-latest
        needs: [database-generate]

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_DB: decm_test
                    POSTGRES_USER: decm_user
                    POSTGRES_PASSWORD: decm_test_password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "pnpm"

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache-dependency-path: |
                      apps/backend/go.sum
                      packages/database/go.sum

            - name: Copy test environment file
              run: cp .env.test .env

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install golang-migrate
              run: |
                  curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xvz
                  sudo mv migrate /usr/local/bin/
                  migrate -version

            - name: Run database migrations
              run: pnpm db:migrate
              env:
                  DB_HOST: localhost
                  DB_PORT: 5432
                  DB_USER: decm_user
                  DB_PASSWORD: decm_test_password
                  DB_NAME: decm_test

            - name: Install sqlc
              run: |
                  curl -sSfL https://github.com/sqlc-dev/sqlc/releases/download/v1.27.0/sqlc_1.27.0_linux_amd64.tar.gz | tar -xz -C /tmp
                  sudo mv /tmp/sqlc /usr/local/bin/
                  sqlc version

            - name: Generate SQLC code
              run: pnpm db:generate

            - name: Install Go dependencies
              working-directory: apps/backend
              run: go mod download

            - name: Setup Go workspace
              working-directory: apps/backend
              run: |
                  echo "Setting up Go workspace..."
                  go work use .
                  go work use ../../packages/database
                  go work sync
                  cat go.work

            - name: Build Core API
              run: pnpm build:core

            - name: Verify binary exists
              run: |
                  if [ ! -f apps/backend/bin/decm-backend ]; then
                    echo "❌ Core API binary not found!"
                    exit 1
                  else
                    echo "✅ Core API binary built successfully"
                  fi

    # Job 5: Backend Unit Tests Successfully
    backend-tests:
        name: Backend Unit Tests
        runs-on: ubuntu-latest
        needs: [backend-build, database-migrate]

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_DB: decm_test
                    POSTGRES_USER: decm_user
                    POSTGRES_PASSWORD: decm_test_password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "pnpm"

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache-dependency-path: |
                      apps/backend/go.sum
                      packages/database/go.sum

            - name: Copy test environment file
              run: cp .env.test .env

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install golang-migrate
              run: |
                  curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xvz
                  sudo mv migrate /usr/local/bin/
                  migrate -version

            - name: Wait for PostgreSQL
              run: |
                  until pg_isready -h localhost -p 5432 -U decm_user; do
                    echo "Waiting for PostgreSQL..."
                    sleep 2
                  done

            - name: Run database migrations
              run: pnpm db:migrate
              env:
                  DB_HOST: localhost
                  DB_PORT: 5432
                  DB_USER: decm_user
                  DB_PASSWORD: decm_test_password
                  DB_NAME: decm_test

            - name: Install sqlc
              run: |
                  curl -sSfL https://github.com/sqlc-dev/sqlc/releases/download/v1.27.0/sqlc_1.27.0_linux_amd64.tar.gz | tar -xz -C /tmp
                  sudo mv /tmp/sqlc /usr/local/bin/
                  sqlc version

            - name: Generate SQLC code
              run: pnpm db:generate

            - name: Install Go dependencies
              working-directory: apps/backend
              run: go mod download

            - name: Setup Go workspace
              working-directory: apps/backend
              run: |
                  go work use .
                  go work use ../../packages/database
                  go work sync

            - name: Run Core Tests
              run: pnpm test:core
              env:
                  DB_HOST: localhost
                  DB_PORT: 5432
                  DB_USER: decm_user
                  DB_PASSWORD: decm_test_password
                  DB_NAME: decm_test
                  PII_ENCRYPTION_KEY: test-encryption-key-for-ci-pipeline-only-32bytes
                  JWT_SECRET: test-jwt-secret-key-for-ci-pipeline-only
                  JWT_ISSUER: decm-service-test
                  JWT_EXPIRATION: 24h

    # Job 6: Backend Generate OpenAPI and Swagger
    backend-openapi:
        name: Backend OpenAPI & Swagger
        runs-on: ubuntu-latest
        needs: [backend-build]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "pnpm"

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: ${{ env.GO_VERSION }}
                  cache-dependency-path: apps/backend/go.sum

            - name: Install swag
              run: go install github.com/swaggo/swag/cmd/swag@latest

            - name: Copy test environment file
              run: cp .env.test .env

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install sqlc
              run: |
                  curl -sSfL https://github.com/sqlc-dev/sqlc/releases/download/v1.27.0/sqlc_1.27.0_linux_amd64.tar.gz | tar -xz -C /tmp
                  sudo mv /tmp/sqlc /usr/local/bin/
                  sqlc version

            - name: Generate SQLC code
              run: pnpm db:generate

            - name: Install Go dependencies
              working-directory: apps/backend
              run: go mod download

            - name: Setup Go workspace
              working-directory: apps/backend
              run: |
                  go work use .
                  go work use ../../packages/database
                  go work sync

            - name: Build Core API (for swag)
              run: pnpm build:core

            - name: Generate OpenAPI documentation
              run: pnpm docs:core

            - name: Check OpenAPI documentation matches committed files
              run: |
                  if ! git diff --exit-code apps/backend/core-api/docs/; then
                    echo "❌ OpenAPI documentation does not match committed files!"
                    echo "Run 'pnpm docs:core' locally and commit the changes."
                    git diff apps/backend/core-api/docs/
                    exit 1
                  else
                    echo "✅ OpenAPI documentation matches committed files"
                  fi

    # Job 7: Frontend Build Successfully
    frontend-build:
        name: Frontend Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "pnpm"

            - name: Copy test environment files
              run: |
                  cp .env.test .env
                  cp .env.client.test .env.client

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run TypeScript type checking
              run: pnpm check-types

            - name: Run ESLint
              run: pnpm lint

            - name: Build frontend
              run: pnpm build

            - name: Verify build artifacts
              run: |
                  if [ ! -d apps/web/dist ]; then
                    echo "❌ Frontend build artifacts not found!"
                    exit 1
                  else
                    echo "✅ Frontend built successfully"
                  fi

    # Job 8: Frontend Unit Test Successfully
    frontend-tests:
        name: Frontend Unit Tests
        runs-on: ubuntu-latest
        needs: [frontend-build]

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ env.PNPM_VERSION }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "pnpm"

            - name: Copy test environment files
              run: |
                  cp .env.test .env
                  cp .env.client.test .env.client

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run Web Tests
              run: pnpm test:web
              env:
                  VITE_API_URL: http://localhost:8080/api/v1
                  VITE_ENVIRONMENT: test

    # Job 9: Contract Build Successfully
    contracts-build:
        name: Contract Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Install Foundry
              uses: foundry-rs/foundry-toolchain@v1
              with:
                  version: nightly

            - name: Compile smart contracts
              working-directory: apps/contracts
              run: |
                  forge install
                  forge build

            - name: Verify contract artifacts
              run: |
                  if [ ! -d apps/contracts/out ]; then
                    echo "❌ Contract compilation artifacts not found!"
                    exit 1
                  else
                    echo "✅ Contracts compiled successfully"
                  fi

    # Job 10: Final Summary
    pr-checks-summary:
        name: PR Checks Summary
        runs-on: ubuntu-latest
        needs:
            [
                docker-compose,
                database-migrate,
                database-generate,
                backend-build,
                backend-tests,
                backend-openapi,
                frontend-build,
                frontend-tests,
                contracts-build,
            ]
        if: always()

        steps:
            - name: Check all jobs status
              run: |
                  echo "### PR Quality Checks Summary ###"
                  echo ""

                  if [ "${{ needs.docker-compose.result }}" = "success" ]; then
                    echo "✅ Docker Compose: PASSED"
                  else
                    echo "❌ Docker Compose: FAILED"
                  fi

                  if [ "${{ needs.database-migrate.result }}" = "success" ]; then
                    echo "✅ Database Migration: PASSED"
                  else
                    echo "❌ Database Migration: FAILED"
                  fi

                  if [ "${{ needs.database-generate.result }}" = "success" ]; then
                    echo "✅ Database Generation: PASSED"
                  else
                    echo "❌ Database Generation: FAILED"
                  fi

                  if [ "${{ needs.backend-build.result }}" = "success" ]; then
                    echo "✅ Backend Build: PASSED"
                  else
                    echo "❌ Backend Build: FAILED"
                  fi

                  if [ "${{ needs.backend-tests.result }}" = "success" ]; then
                    echo "✅ Backend Unit Tests: PASSED"
                  else
                    echo "❌ Backend Unit Tests: FAILED"
                  fi

                  if [ "${{ needs.backend-openapi.result }}" = "success" ]; then
                    echo "✅ Backend OpenAPI & Swagger: PASSED"
                  else
                    echo "❌ Backend OpenAPI & Swagger: FAILED"
                  fi

                  if [ "${{ needs.frontend-build.result }}" = "success" ]; then
                    echo "✅ Frontend Build: PASSED"
                  else
                    echo "❌ Frontend Build: FAILED"
                  fi

                  if [ "${{ needs.frontend-tests.result }}" = "success" ]; then
                    echo "✅ Frontend Unit Tests: PASSED"
                  else
                    echo "❌ Frontend Unit Tests: FAILED"
                  fi

                  if [ "${{ needs.contracts-build.result }}" = "success" ]; then
                    echo "✅ Contract Build: PASSED"
                  else
                    echo "❌ Contract Build: FAILED"
                  fi

                  echo ""

                  if [ "${{ needs.docker-compose.result }}" = "success" ] && \
                     [ "${{ needs.database-migrate.result }}" = "success" ] && \
                     [ "${{ needs.database-generate.result }}" = "success" ] && \
                     [ "${{ needs.backend-build.result }}" = "success" ] && \
                     [ "${{ needs.backend-tests.result }}" = "success" ] && \
                     [ "${{ needs.backend-openapi.result }}" = "success" ] && \
                     [ "${{ needs.frontend-build.result }}" = "success" ] && \
                     [ "${{ needs.frontend-tests.result }}" = "success" ] && \
                     [ "${{ needs.contracts-build.result }}" = "success" ]; then
                    echo "🎉 All checks passed! PR is ready to merge."
                    exit 0
                  else
                    echo "❌ Some checks failed. Please review and fix the issues."
                    exit 1
                  fi
