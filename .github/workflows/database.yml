name: Database Checks

on:
    workflow_call:
        inputs:
            go-version:
                required: true
                type: string
            node-version:
                required: true
                type: string
            pnpm-version:
                required: true
                type: string

jobs:
    # Database Migration Test
    migrate:
        name: Database Migration
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_DB: decm_test
                    POSTGRES_USER: decm_user
                    POSTGRES_PASSWORD: decm_test_password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js and pnpm
              uses: ./.github/actions/setup-node-pnpm
              with:
                  node-version: ${{ inputs.node-version }}
                  pnpm-version: ${{ inputs.pnpm-version }}

            - name: Install Database Tools
              uses: ./.github/actions/install-db-tools
              with:
                  install-sqlc: "false"

            - name: Wait for PostgreSQL
              run: |
                  until pg_isready -h localhost -p 5432 -U decm_user; do
                    echo "Waiting for PostgreSQL..."
                    sleep 2
                  done

            - name: Run database migrations
              run: pnpm db:migrate
              env:
                  DB_HOST: localhost
                  DB_PORT: 5432
                  DB_USER: decm_user
                  DB_PASSWORD: decm_test_password
                  DB_NAME: decm_test

            - name: Verify migrations applied successfully
              run: |
                  PGPASSWORD=decm_test_password psql -h localhost -U decm_user -d decm_test -c "\dt" | tee migration_output.txt
                  grep -q "authentication_credentials" migration_output.txt
                  grep -q "profiles" migration_output.txt
                  grep -q "events" migration_output.txt
                  echo "✅ All core tables verified"

    # SQLC Code Generation Test
    generate:
        name: Database Generation (SQLC)
        runs-on: ubuntu-latest
        needs: [migrate]

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_DB: decm_test
                    POSTGRES_USER: decm_user
                    POSTGRES_PASSWORD: decm_test_password
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 10s
                    --health-timeout 5s
                    --health-retries 5

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: ${{ inputs.pnpm-version }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ inputs.node-version }}
                  cache: "pnpm"

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: ${{ inputs.go-version }}
                  cache-dependency-path: packages/database/go.sum

            - name: Copy test environment file
              run: cp .env.test .env

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install sqlc
              run: |
                  curl -sSfL https://github.com/sqlc-dev/sqlc/releases/download/v1.29.0/sqlc_1.29.0_linux_amd64.tar.gz | tar -xz -C /tmp
                  sudo mv /tmp/sqlc /usr/local/bin/
                  sqlc version

            - name: Install golang-migrate
              run: |
                  curl -L https://github.com/golang-migrate/migrate/releases/download/v4.17.0/migrate.linux-amd64.tar.gz | tar xvz
                  sudo mv migrate /usr/local/bin/
                  migrate -version

            - name: Wait for PostgreSQL
              run: |
                  until pg_isready -h localhost -p 5432 -U decm_user; do
                    echo "Waiting for PostgreSQL..."
                    sleep 2
                  done

            - name: Run database migrations
              run: pnpm db:migrate
              env:
                  DB_HOST: localhost
                  DB_PORT: 5432
                  DB_USER: decm_user
                  DB_PASSWORD: decm_test_password
                  DB_NAME: decm_test

            - name: Generate SQLC code
              run: pnpm db:generate

            - name: Check SQLC generated files match committed files
              run: |
                  if ! git diff --exit-code packages/database/go/generated/; then
                    echo "❌ SQLC generated files do not match committed files!"
                    echo "Run 'pnpm db:generate' locally and commit the changes."
                    git diff packages/database/go/generated/
                    exit 1
                  else
                    echo "✅ SQLC generated files match committed files"
                  fi
