version: "2"
sql:
  - engine: "postgresql"
    queries: "./queries"
    schema: "./migrations"
    gen:
      go:
        package: "generated"
        out: "./go/generated"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        emit_prepared_queries: false
        emit_exact_table_names: false
        emit_empty_slices: true
        emit_exported_queries: true
        emit_result_struct_pointers: false
        emit_params_struct_pointers: false
        emit_methods_with_db_argument: false
        emit_pointers_for_null_types: false
        emit_enum_valid_method: true
        emit_all_enum_values: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "timestamp"
            go_type: "time.Time"
          - db_type: "timestamptz"
            go_type: "time.Time"
          # Authentication credentials nullable fields
          - column: "authentication_credentials.google_connector_ref"
            go_type: "pgtype.Text"
          - column: "authentication_credentials.github_connector_ref" 
            go_type: "pgtype.Text"
          # Profiles nullable PII fields
          - column: "profiles.profile_picture_url"
            go_type: "pgtype.Text"
          - column: "profiles.first_name"
            go_type: "pgtype.Text"
          - column: "profiles.last_name"
            go_type: "pgtype.Text"
          - column: "profiles.email"
            go_type: "pgtype.Text"
          - column: "profiles.bio"
            go_type: "pgtype.Text"
          - column: "profiles.phone_number"
            go_type: "pgtype.Text"
          - column: "profiles.address"
            go_type: "pgtype.Text"
          - column: "profiles.academic_institution"
            go_type: "pgtype.Text"
          - column: "profiles.academic_email"
            go_type: "pgtype.Text"
