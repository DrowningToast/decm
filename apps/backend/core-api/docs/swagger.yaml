host: localhost:8080
info:
  contact: {}
  description: DECM (Decentralized Event Management) platform API for NFT ticketing,
    digital credentials, and academic identity verification.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: DECM Core
  version: "1.0"
paths:
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      description: Logout user by clearing session and OAuth cookies
      operationId: logout
      produces:
      - application/json
      responses:
        "200":
          description: Successfully logged out
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/customerror.ErrResponse'
      summary: Logout
      tags:
      - Auth
  /api/v1/auth/request-google-oauth:
    get:
      consumes:
      - application/json
      description: Request Google OAuth
      operationId: request-google-oauth
      produces:
      - application/json
      responses:
        "302":
          description: Found
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/customerror.ErrResponse'
      summary: Request Google OAuth
      tags:
      - Auth
  /api/v1/auth/verify-google-oauth:
    get:
      consumes:
      - application/json
      description: Verify Google OAuth code
      operationId: verify-google-oauth
      parameters:
      - in: query
        name: code
        required: true
        type: string
      - in: query
        name: state
        required: true
        type: string
      - in: query
        name: code
        required: true
        type: string
      - in: query
        name: state
        required: true
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: Found
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/customerror.ErrResponse'
      summary: Verify Google OAuth code
      tags:
      - Auth
  /api/v1/events:
    post:
      consumes:
      - multipart/form-data
      description: Create a new event with banner image upload
      operationId: create-event
      parameters:
      - description: Event name
        in: formData
        name: name
        required: true
        type: string
      - description: Event short description
        in: formData
        name: short_description
        required: true
        type: string
      - description: Event description
        in: formData
        name: description
        required: true
        type: string
      - description: Start date (RFC3339 format)
        in: formData
        name: start_date
        required: true
        type: string
      - description: End date (RFC3339 format)
        in: formData
        name: end_date
        required: true
        type: string
      - description: Number of seats
        in: formData
        name: seats_count
        required: true
        type: integer
      - description: Contact number
        in: formData
        name: contact_number
        required: true
        type: string
      - description: Contact address
        in: formData
        name: contact_address
        required: true
        type: string
      - description: Location
        in: formData
        name: location
        required: true
        type: string
      - description: Google map query
        in: formData
        name: google_map_query
        required: true
        type: string
      - description: Event banner image (JPEG, PNG, WebP, max 10MB)
        in: formData
        name: banner
        required: true
        type: file
      - description: Event icon image (JPEG, PNG, WebP, max 10MB)
        in: formData
        name: icon
        required: true
        type: file
      - description: Host password
        in: formData
        name: host_password
        required: true
        type: string
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/entity.Event'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/customerror.ErrResponse'
      summary: Create a new event
      tags:
      - Event
  /api/v1/events/{event_id}:
    delete:
      consumes:
      - application/json
      description: Delete event by ID
      operationId: delete-event-by-id
      parameters:
      - description: Event ID
        in: path
        name: event_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/event.EventResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/customerror.ErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/customerror.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/customerror.ErrResponse'
      summary: Delete event by ID
      tags:
      - Event
    get:
      consumes:
      - application/json
      description: Get event by ID
      operationId: get-event-by-id
      parameters:
      - description: Event ID
        in: path
        name: event_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/event.EventResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/customerror.ErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/customerror.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/customerror.ErrResponse'
      summary: Get event by ID
      tags:
      - Events
    put:
      consumes:
      - multipart/form-data
      description: Update an existing event with optional banner and icon image upload
      operationId: update-event
      parameters:
      - description: Event name
        in: formData
        name: name
        type: string
      - description: Event short description
        in: formData
        name: short_description
        type: string
      - description: Event description
        in: formData
        name: description
        type: string
      - description: Start date (RFC3339 format)
        in: formData
        name: start_date
        required: true
        type: string
      - description: End date (RFC3339 format)
        in: formData
        name: end_date
        required: true
        type: string
      - description: Number of seats
        in: formData
        name: seats_count
        required: true
        type: integer
      - description: Contact number
        in: formData
        name: contact_number
        type: string
      - description: Contact address
        in: formData
        name: contact_address
        type: string
      - description: Location
        in: formData
        name: location
        type: string
      - description: Google map query
        in: formData
        name: google_map_query
        type: string
      - description: Event banner image (JPEG, PNG, WebP, max 10MB) - optional
        in: formData
        name: banner
        type: file
      - description: Event icon image (JPEG, PNG, WebP, max 10MB) - optional
        in: formData
        name: icon
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/entity.Event'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/customerror.ErrResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/customerror.ErrResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/customerror.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/customerror.ErrResponse'
      summary: Update an event
      tags:
      - Event
  /api/v1/events/{event_id}/certificate-config:
    delete:
      consumes:
      - application/json
      description: Delete event certificate configuration for an event
      operationId: delete-event-certificate-config
      parameters:
      - description: Event ID
        in: path
        name: event_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/customerror.ErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/customerror.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/customerror.ErrResponse'
      summary: Delete event certificate config
      tags:
      - EventConfig
  /api/v1/events/{event_id}/config/certificate:
    get:
      consumes:
      - application/json
      description: Get the event certificate configuration for an event
      operationId: get-event-certificate-config
      parameters:
      - description: Event ID
        in: path
        name: event_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/core-api_internal_handler_eventconfig.EventCertificateConfigResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/customerror.ErrResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/customerror.ErrResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/customerror.ErrResponse'
      summary: Get event certificate config
    put:
      consumes:
      - application/json
      description: Update the event certificate configuration for an event
      operationId: update-event-certificate-config
      parameters:
      - description: Event ID
        in: path
        name: event_id
        required: true
        type: string
      - description: Base certificate image
        in: formData
        name: base_certificate_image
        type: file
      - description: Event name position x
        format: float64
        in: formData
        name: event_name_pos_x
        required: true
        type: number
      - description: Event name position y
        format: float64
        in: formData
        name: event_name_pos_y
        required: true
        type: number
