basePath: /
definitions:
  customerror.Err:
    description: Custom error type
    properties:
      code:
        type: string
      http_status:
        type: integer
      message:
        type: string
      reasons:
        additionalProperties:
          type: string
        type: object
    type: object
  customerror.ErrResponse:
    description: Response for the client to sign to register
    properties:
      message:
        type: string
    type: object
  entity.Profile:
    properties:
      academic_email:
        type: string
      academic_institution:
        type: string
      address:
        type: string
      authentication_credential_id:
        type: string
      bio:
        type: string
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      is_academic_email_public:
        type: boolean
      is_academic_institution_public:
        type: boolean
      is_address_public:
        type: boolean
      is_bio_public:
        type: boolean
      is_email_public:
        type: boolean
      is_first_name_public:
        type: boolean
      is_last_name_public:
        type: boolean
      is_phone_number_public:
        type: boolean
      is_profile_picture_public:
        type: boolean
      last_name:
        type: string
      phone_number:
        type: string
      profile_picture_url:
        type: string
      updated_at:
        type: string
    type: object
  onboard.CheckOnboardStatusRequest:
    properties:
      access_token:
        type: string
      expires_in:
        type: integer
      method:
        allOf:
        - $ref: '#/definitions/onboard.RegistrationMethod'
        enum:
        - google
        - wallet
      sign_message:
        type: string
    required:
    - method
    type: object
  onboard.CheckOnboardStatusResponse:
    properties:
      authentication_credential_id:
        type: string
      profile_id:
        type: string
    type: object
  onboard.RegistrationMethod:
    enum:
    - google
    - wallet
    type: string
    x-enum-varnames:
    - RegistrationMethodGoogle
    - RegistrationMethodWallet
  onboard.getRegisterSignMessageResponse:
    description: Response for the client to sign to register
    properties:
      message:
        type: string
    type: object
  onboard.registerWithGoogleOAuthRequest:
    properties:
      access_token:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - password
    type: object
  onboard.registerWithGoogleOAuthResponse:
    properties:
      mnemonic:
        items:
          type: string
        type: array
    type: object
  onboard.registerWithWalletRequest:
    properties:
      signed_message:
        type: string
    type: object
  profile.CreateProfileRequest:
    properties:
      academic_email:
        type: string
      academic_institution:
        maxLength: 255
        minLength: 3
        type: string
      address:
        maxLength: 255
        minLength: 10
        type: string
      authentication_credential_id:
        type: string
      bio:
        maxLength: 255
        minLength: 10
        type: string
      email:
        maxLength: 64
        type: string
      first_name:
        maxLength: 32
        minLength: 3
        type: string
      is_academic_email_public:
        type: boolean
      is_academic_institution_public:
        type: boolean
      is_address_public:
        type: boolean
      is_bio_public:
        type: boolean
      is_email_public:
        type: boolean
      is_first_name_public:
        type: boolean
      is_last_name_public:
        type: boolean
      is_phone_number_public:
        type: boolean
      is_profile_picture_public:
        type: boolean
      last_name:
        maxLength: 32
        minLength: 3
        type: string
      phone_number:
        type: string
      profile_picture_url:
        type: string
    required:
    - authentication_credential_id
    type: object
  profile.CreateProfileResponse:
    properties:
      academic_email:
        type: string
      academic_institution:
        type: string
      address:
        type: string
      authentication_credential_id:
        type: string
      bio:
        type: string
      created_at:
        type: string
      email:
        type: string
      first_name:
        type: string
      id:
        type: string
      is_academic_email_public:
        type: boolean
      is_academic_institution_public:
        type: boolean
      is_address_public:
        type: boolean
      is_bio_public:
        type: boolean
      is_email_public:
        type: boolean
      is_first_name_public:
        type: boolean
      is_last_name_public:
        type: boolean
      is_phone_number_public:
        type: boolean
      is_profile_picture_public:
        type: boolean
      last_name:
        type: string
      phone_number:
        type: string
      profile_picture_url:
        type: string
      updated_at:
        type: string
    type: object
  profile.UpdateProfileRequest:
    properties:
      academic_email:
        type: string
      academic_institution:
        maxLength: 255
        minLength: 3
        type: string
      address:
        maxLength: 255
        minLength: 10
        type: string
      bio:
        maxLength: 255
        minLength: 10
        type: string
      email:
        maxLength: 64
        type: string
      first_name:
        maxLength: 32
        minLength: 3
        type: string
      is_academic_email_public:
        type: boolean
      is_academic_institution_public:
        type: boolean
      is_address_public:
        type: boolean
      is_bio_public:
        type: boolean
      is_email_public:
        type: boolean
      is_first_name_public:
        type: boolean
      is_last_name_public:
        type: boolean
      is_phone_number_public:
        type: boolean
      is_profile_picture_public:
        type: boolean
      last_name:
        maxLength: 32
        minLength: 3
        type: string
      phone_number:
        type: string
      profile_picture_url:
        type: string
    type: object
  profile.UpdateProfileResponse:
    properties:
      academic_email:
        type: string
      academic_institution:
        type: string
      address:
        type: string
      authentication_credential_id:
        type: string
      bio:
