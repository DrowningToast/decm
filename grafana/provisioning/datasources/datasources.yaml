# Grafana Datasource Provisioning
# https://grafana.com/docs/grafana/latest/administration/provisioning/#data-sources

apiVersion: 1

datasources:
    # Prometheus for metrics
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true
      editable: true
      jsonData:
          timeInterval: 5s
          httpMethod: POST

    # Loki for logs
    - name: Loki
      type: loki
      access: proxy
      url: http://loki:3100
      editable: true
      jsonData:
          maxLines: 1000
          derivedFields:
              # Extract request_id from log lines to link logs to traces
              - datasourceUid: loki
                matcherRegex: "request_id[\"=:]\\s*\"?([\\w-]+)"
                name: RequestID
                url: $${__value.raw}
