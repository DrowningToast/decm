services:
    postgres:
        image: postgres:16-alpine
        container_name: decm-postgres
        restart: unless-stopped
        command:
            - "postgres"
            - "-c"
            - "log_statement=all" # Log all queries
            - "-c"
            - "log_min_duration_statement=0" # Log query duration
            - "-c"
            - "log_connections=on" # Log connections
            - "-c"
            - "log_disconnections=on" # Log disconnections
            - "-c"
            - "log_line_prefix=%t [%p]: [%l-1] user=%u,db=%d " # Better formatting
            - "-c"
            - "logging_collector=off" # Use stderr (easier with Docker)
        environment:
            POSTGRES_DB: ${DB_NAME:-decm}
            POSTGRES_USER: ${DB_USER:-decm_user}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-decm_password}
            POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
        ports:
            - "${DB_PORT:-5432}:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
            - ./database/backups:/backups
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-decm_user} -d ${DB_NAME:-decm}"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s
        networks:
            - decm-network

    # Optional: pgAdmin for database management UI
    pgadmin:
        image: dpage/pgadmin4:9.0
        container_name: decm-pgadmin
        restart: unless-stopped
        environment:
            PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@decm.local}
            PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
            PGADMIN_CONFIG_SERVER_MODE: "False"
        ports:
            - "${PGADMIN_PORT:-5050}:80"
        volumes:
            - pgadmin_data:/var/lib/pgadmin
        depends_on:
            postgres:
                condition: service_healthy
        networks:
            - decm-network
        profiles:
            - tools # Only start when explicitly requested

    prometheus:
        image: prom/prometheus:v3.8.1
        container_name: prometheus
        volumes:
            - ./prometheus/config.yaml:/etc/prometheus/prometheus.yml
            - prometheus_data:/prometheus
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
        ports:
            - "9090:9090"
        restart: unless-stopped
        networks:
            - decm-network
        profiles:
            - monitoring

    # Monitoring - Loki (Log Aggregation)
    loki:
        image: grafana/loki:3.3.2
        container_name: decm-loki
        volumes:
            - ./loki/config.yaml:/etc/loki/config.yaml
            - loki_data:/loki
        command: -config.file=/etc/loki/config.yaml
        ports:
            - "3100:3100"
        restart: unless-stopped
        networks:
            - decm-network
        profiles:
            - monitoring

    # Monitoring - Alloy (Log Collection Agent)
    alloy:
        image: grafana/alloy:v1.5.1
        container_name: decm-alloy
        volumes:
            - ./alloy/config.dev.alloy:/etc/alloy/config.alloy
            - ./apps/backend/logs:/var/log/backend/logs:ro
            - alloy_data:/var/lib/alloy
        command:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy
            - /etc/alloy/config.alloy
        environment:
            - ENVIRONMENT=${ENVIRONMENT:-development}
        ports:
            - "12345:12345"
        depends_on:
            - loki
        restart: unless-stopped
        networks:
            - decm-network
        profiles:
            - monitoring

    # Monitoring - Grafana
    grafana:
        image: grafana/grafana:11.4.0
        container_name: decm-grafana
        volumes:
            - grafana_data:/var/lib/grafana
            - ./grafana/provisioning:/etc/grafana/provisioning
        environment:
            - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
            - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
            - GF_USERS_ALLOW_SIGN_UP=false
        ports:
            - "3001:3000"
        depends_on:
            - prometheus
            - loki
        restart: unless-stopped
        networks:
            - decm-network
        profiles:
            - monitoring

    node-exporter:
        image: prom/node-exporter:v1.10.2
        container_name: node-exporter
        volumes:
            - /proc:/host/proc:ro
            - /sys:/host/sys:ro
            - /:/rootfs:ro
        command:
            - "--path.procfs=/host/proc"
            - "--path.sysfs=/host/sys"
            - "--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)"
        ports:
            - "9100:9100"
        restart: unless-stopped
        depends_on:
            - prometheus
        networks:
            - decm-network
        profiles:
            - monitoring

volumes:
    postgres_data:
        driver: local
    pgadmin_data:
        driver: local
    prometheus_data:
        driver: local
    loki_data:
        driver: local
    alloy_data:
        driver: local
    grafana_data:
        driver: local

networks:
    decm-network:
        driver: bridge
